# Despliegue permanente con login (Render, plan gratis)
# https://render.com -> New -> Blueprint -> conecta este repo
services:
  - type: web
    name: tests-universidad
    runtime: python
    plan: free
    startCommand: python3 server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      # PORT lo pone Render automáticamente y server.py ya lo lee.
      # USERS_JSON: pega aquí el contenido de tu users.json (una línea).
      # Para generarlo en local: python3 -c "import json; print(json.dumps(json.load(open('users.json'))))"
      - key: USERS_JSON
        sync: false
